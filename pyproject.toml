[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-support-recovery"
version = "0.1.0"
description = "Select Lambda model supports from an empirical covariance matrix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lambda_support_recovery*"]
namespaces = false
